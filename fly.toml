# fly.toml app configuration file generated for krispy-gestiones on 2026-07-25T15:11:25Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'krispy-gestiones'
primary_region = 'iad'

[build]

[env]
  # backend/main.py escucha en esta variable de entorno (por defecto 8000
  # si no está puesta) - tiene que coincidir con internal_port de abajo.
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
