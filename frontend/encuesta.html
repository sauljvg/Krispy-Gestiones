<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test</title>
<link rel="icon" type="image/png" href="assets/favicon-kk.png">
<link rel="stylesheet" href="css/styles.css?v=20260902d">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  /* Esta página siempre es clara a propósito (foto de fondo + tarjeta
     blanca, como Microsoft Forms), sin importar el tema oscuro/claro que
     el candidato tenga guardado de haber visitado antes el panel interno
     — por eso el color va explícito y no hereda var(--text-primary) del
     hoja de estilos compartida (esa sí cambia con el tema). */
  body {
    margin: 0; min-height: 100vh; font-family: "Brandon Grotesque", system-ui, sans-serif;
    background: #f5f0e8 center / cover no-repeat fixed;
    display: flex; align-items: center; justify-content: center; padding: 24px 12px;
    color: #222;
  }
  body.con-fondo { background-image: var(--fondo-url); }
  .encuesta-card {
    background: rgba(255,255,255,0.97); border-radius: 18px; box-shadow: 0 12px 40px rgba(0,0,0,0.16);
    max-width: 640px; width: 100%; padding: 32px 36px; position: relative;
  }
  @media (max-width: 480px) {
    body { padding: 12px 8px; }
    .encuesta-card { padding: 24px 16px; }
  }
  .encuesta-titulo { font-family: "Gelica", system-ui, sans-serif; font-size: 24px; font-weight: 600; margin: 0 0 6px; color: #222; letter-spacing: -0.01em; }
  .encuesta-instrucciones { font-size: 14px; color: #555; margin: 0 0 22px; line-height: 1.5; white-space: pre-wrap; }
  .encuesta-obligatorio-nota { font-size: 12px; color: #900; margin-bottom: 16px; }
  .encuesta-anticheat-banner { background: #fbf3e6; border: 1px solid #e8d3a8; border-radius: 12px; padding: 14px 18px; margin: 0 0 20px; font-size: 14px; color: #6b5228; line-height: 1.4; }
  .encuesta-anticheat-banner p { margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  .encuesta-anticheat-banner p:last-child { margin-bottom: 0; }
  .encuesta-anticheat-intro { font-weight: 500; font-size: 15px; }
  .encuesta-anticheat-aviso { font-weight: 700; margin-top: 4px; text-transform: uppercase; font-size: 12px; letter-spacing: .04em; color: #8a6a1f; }
  .encuesta-anticheat-lista { list-style: none; margin: 2px 0 8px; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .encuesta-anticheat-lista li { display: flex; align-items: center; gap: 10px; }
  .encuesta-anticheat-icono { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; flex-shrink: 0; font-size: 20px; }
  .encuesta-anticheat-icono.tiempo { color: #c98a12; }
  .encuesta-anticheat-icono.restriccion { color: #d03b3b; }
  .encuesta-anticheat-cierre { font-weight: 600; font-size: 15px; }

  .pregunta-bloque { margin-bottom: 26px; }
  .pregunta-label { font-size: 15px; font-weight: 600; color: #222; margin-bottom: 8px; display: block; }
  .pregunta-label .req { color: #c00; }
  .pregunta-bloque input[type="text"], .pregunta-bloque input[type="email"], .pregunta-bloque input[type="number"], .pregunta-bloque input[type="date"], .pregunta-bloque textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; font-family: inherit;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .pregunta-bloque input:focus, .pregunta-bloque textarea:focus {
    outline: none; border-color: var(--color-boton, #5b2a2a);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-boton, #5b2a2a) 18%, transparent);
  }
  .pregunta-bloque textarea { min-height: 80px; resize: vertical; }

  .calificacion-estrellas { display: flex; gap: 6px; }
  .btn-estrella { border: none; background: none; font-size: 30px; line-height: 1; cursor: pointer; color: #d8d8d8; padding: 2px; }
  .btn-estrella.activa { color: var(--color-boton, #5b2a2a); }

  .likert-tabla-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .likert-tabla { width: 100%; border-collapse: collapse; font-size: 13px; }
  .likert-tabla th { font-weight: 500; color: #555; padding: 6px 4px; text-align: center; vertical-align: bottom; width: 15%; }
  .likert-tabla td { padding: 10px 4px; border-top: 1px solid #eee; text-align: center; }
  .likert-tabla td.likert-etiqueta { text-align: left; font-size: 14px; color: #222; padding-right: 10px; width: 25%; }
  .likert-tabla input[type="radio"] { width: 18px; height: 18px; cursor: pointer; }

  /* En pantallas estrechas no caben 5 columnas + etiqueta sin aplastar el
     texto ("Totalmente en desacuerdo" quedaba cortado fuera de la tarjeta,
     y obligar a deslizar para verlo es incómodo) — por debajo de 560px la
     tabla deja de comportarse como tabla: cada pregunta pasa a ser un
     bloque con sus 5 opciones en una lista vertical (radio + su etiqueta
     completa), igual que hace Microsoft/Google Forms en móvil. Nada se
     corta ni hace falta deslizar; solo cambia el layout, el valor que se
     envía (la posición 1-5) es exactamente el mismo. */
  @media (max-width: 560px) {
    .likert-tabla, .likert-tabla thead, .likert-tabla tbody, .likert-tabla tr, .likert-tabla td { display: block; width: auto; }
    .likert-tabla thead { display: none; }
    .likert-tabla tr { padding: 14px 0; border-top: 1px solid #eee; }
    .likert-tabla tr:first-child { border-top: none; padding-top: 0; }
    .likert-tabla td { border-top: none; padding: 0; text-align: left; }
    .likert-tabla td.likert-etiqueta { width: 100%; padding-bottom: 10px; font-weight: 600; }
    .likert-tabla td:not(.likert-etiqueta) {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 2px; border-top: 1px solid #f2f2f2;
    }
    .likert-tabla td:not(.likert-etiqueta)::before { content: attr(data-label); font-size: 13px; color: #333; }
  }

  .opcion-multiple-lista label { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 8px; cursor: pointer; }
  .opcion-multiple-lista input[type="radio"], .opcion-multiple-lista input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }

  .prioridad-ayuda { font-size: 12px; color: #777; margin: 0 0 10px; }
  .prioridad-lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .prioridad-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #e2e2e2; border-radius: 8px; background: #fafafa; }
  .prioridad-num { width: 22px; height: 22px; border-radius: 50%; background: var(--color-boton, #5b2a2a); color: #fff; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .prioridad-texto { flex: 1; font-size: 14px; color: #222; }
  .prioridad-flechas { display: flex; gap: 4px; flex-shrink: 0; }
  .prioridad-flechas button { border: 1px solid #ccc; background: #fff; border-radius: 6px; width: 26px; height: 26px; cursor: pointer; font-size: 13px; color: #444; }
  .prioridad-flechas button:disabled { opacity: 0.3; cursor: default; }
  .prioridad-flechas button:not(:disabled):hover { background: #f0f0f0; }

  .encuesta-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; }
  .encuesta-nav .spacer { flex: 1; }
  .encuesta-btn {
    border: none; border-radius: 10px; padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
    color: #fff; background: var(--color-boton, #5b2a2a);
    transition: transform .1s ease, box-shadow .15s ease, opacity .15s ease;
    box-shadow: 0 2px 10px color-mix(in srgb, var(--color-boton, #5b2a2a) 35%, transparent);
  }
  .encuesta-btn:hover { opacity: 0.92; box-shadow: 0 4px 14px color-mix(in srgb, var(--color-boton, #5b2a2a) 45%, transparent); }
  .encuesta-btn:active { transform: translateY(1px); }
  .encuesta-btn.secundario { background: transparent; color: #555; border: 1px solid #ccc; box-shadow: none; }
  .encuesta-btn.secundario:hover { background: #f5f5f5; opacity: 1; }
  .encuesta-progreso-txt { font-size: 13px; color: #777; }
  .encuesta-progreso-barra { width: 100%; height: 5px; border-radius: 4px; background: #eee; margin-top: 6px; overflow: hidden; }
  .encuesta-progreso-fill { height: 100%; background: var(--color-boton, #5b2a2a); border-radius: 4px; transition: width 0.2s; }

  .encuesta-privacidad-nota { font-size: 11px; color: #999; margin: 14px 0 0; line-height: 1.4; }
  .encuesta-privacidad-nota a { color: #777; }

  .encuesta-final { text-align: center; padding: 20px 0; }
  .encuesta-final .icono { font-size: 40px; margin-bottom: 12px; }
  .encuesta-error { text-align: center; color: #900; padding: 30px 0; }

  /* Contador del anti-fraude (solo tests de Valores y Competencias, ver
     encuesta.js::iniciarAnticheat) -- fijo en la esquina, fuera de
     .encuesta-card, para que sobreviva a que la tarjeta se redibuje entera
     en cada cambio de página. */
  .anticheat-timer {
    position: fixed; top: 14px; right: 14px; z-index: 900;
    background: rgba(255,255,255,0.95); border: 1px solid #ddd; border-radius: 10px;
    padding: 6px 14px; font-size: 15px; font-weight: 600; color: #222;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12); font-variant-numeric: tabular-nums;
  }
  .anticheat-timer.agotado { color: #c00; border-color: #e5b3b3; background: #fff5f5; }
  @media (max-width: 480px) {
    .anticheat-timer { top: 8px; right: 8px; padding: 5px 10px; font-size: 13px; }
  }
</style>
</head>
<body>
  <div class="encuesta-card" id="encuesta-card">
    <p class="staff-hint">Cargando...</p>
  </div>
<script src="js/dialogs.js?v=20260818a"></script>
<script src="js/icons.js?v=20260903a"></script>
<script src="js/common.js?v=20260823a"></script>
<script src="js/encuesta.js?v=20260903c"></script>
</body>
</html>
