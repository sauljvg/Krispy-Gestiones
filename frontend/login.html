<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krispy Gestiones · Acceso</title>
<link rel="icon" type="image/png" href="assets/favicon-kk.png">
<script>
  (function () {
    var guardado = localStorage.getItem("kt-theme");
    if (guardado === "light" || guardado === "dark") {
      document.documentElement.dataset.theme = guardado;
    }
  })();
</script>
<link rel="stylesheet" href="css/styles.css?v=20260823c">
<style>
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 20px;
    /* Fondo con un halo muy suave del color de marca detrás de la tarjeta,
       para que la pantalla de acceso no sea un vacío liso. */
    background:
      radial-gradient(60% 45% at 50% 32%, color-mix(in srgb, var(--acento) 12%, transparent), transparent 70%),
      var(--surface-page);
  }
  #btn-theme-toggle.login-theme-btn {
    position: absolute;
    top: 20px;
    right: 20px;
  }
  .login-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 1px 2px rgba(17,17,17,0.04), 0 18px 50px color-mix(in srgb, var(--acento) 14%, rgba(17,17,17,0.10));
  }
  .login-brand-badge {
    width: 60px; height: 60px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; margin: 0 auto 16px;
    background: color-mix(in srgb, var(--acento) 12%, var(--surface-1));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acento) 22%, transparent);
  }
  .login-card h1 { margin: 0 0 4px; font-size: 22px; text-align: center; font-family: var(--font-display); font-weight: 600; }
  .login-card > form > p:first-of-type,
  .login-card p.login-sub { margin: 0 0 22px; color: var(--text-secondary); font-size: 13px; text-align: center; }
  .login-field { margin-bottom: 14px; }
  .login-field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .login-field input {
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-page);
    color: var(--text-primary);
    font-size: 14px;
  }
  .login-error {
    color: var(--status-critical);
    font-size: 13px;
    margin: -6px 0 14px;
  }
  .login-hint { color: var(--text-secondary); font-size: 12px; margin: -10px 0 14px; }
  #login-form-usuario .btn, #login-form-pin .btn { width: 100%; justify-content: center; }
  .login-pin-input {
    width: 100%; padding: 14px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-page); color: var(--text-primary); font-size: 24px;
    text-align: center; letter-spacing: 10px; font-weight: 700;
  }
  .login-back { background: none; border: none; color: var(--text-secondary); font-size: 12px; cursor: pointer; margin-bottom: 14px; padding: 0; }
</style>
</head>
<body>
<div class="login-wrap">
  <button id="btn-theme-toggle" class="btn btn-ghost login-theme-btn" aria-label="Cambiar tema" title="Cambiar entre claro y oscuro">🌙</button>
  <div class="login-card">
    <div class="login-brand-badge">🍩</div>
    <h1>Krispy Gestiones</h1>

    <form id="login-form-usuario">
      <p>Inicia sesión para continuar.</p>
      <div class="login-field">
        <label for="login-username">Usuario</label>
        <input type="text" id="login-username" autocomplete="username" required>
      </div>
      <p class="login-error" id="login-error-usuario" hidden></p>
      <button type="submit" class="btn btn-primary">Continuar</button>
    </form>

    <form id="login-form-pin" hidden>
      <button type="button" class="login-back" id="btn-login-back">← Cambiar de usuario</button>
      <p id="login-pin-hint"></p>
      <div class="login-field">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="login-pin-input" id="login-pin" autocomplete="off" required>
      </div>
      <div class="login-field" id="login-pin-confirm-wrap" hidden>
        <label for="login-pin-confirm">Repite el PIN</label>
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="login-pin-input" id="login-pin-confirm" autocomplete="off">
      </div>
      <p class="login-error" id="login-error-pin" hidden></p>
      <button type="submit" class="btn btn-primary" id="btn-login-pin-submit">Entrar</button>
    </form>
  </div>
</div>
<script src="js/icons.js?v=20260824a"></script>
<script src="js/theme.js?v=20260722c"></script>
<script src="js/login.js?v=20260722c"></script>
</body>
</html>
