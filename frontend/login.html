<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krispy Gestiones · Acceso</title>
<script>
  (function () {
    var guardado = localStorage.getItem("kt-theme");
    if (guardado === "light" || guardado === "dark") {
      document.documentElement.dataset.theme = guardado;
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=20260722c">
<style>
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #btn-theme-toggle.login-theme-btn {
    position: absolute;
    top: 20px;
    right: 20px;
  }
  .login-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 340px;
  }
  .login-card h1 { margin: 0 0 4px; font-size: 20px; display: flex; align-items: center; gap: 10px; }
  .login-card p { margin: 0 0 20px; color: var(--text-secondary); font-size: 13px; }
  .login-field { margin-bottom: 14px; }
  .login-field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .login-field input {
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-page);
    color: var(--text-primary);
    font-size: 14px;
  }
  .login-error {
    color: var(--status-critical);
    font-size: 13px;
    margin: -6px 0 14px;
  }
  .login-hint { color: var(--text-secondary); font-size: 12px; margin: -10px 0 14px; }
  #login-form-usuario .btn, #login-form-pin .btn { width: 100%; justify-content: center; }
  .login-pin-input {
    width: 100%; padding: 14px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-page); color: var(--text-primary); font-size: 24px;
    text-align: center; letter-spacing: 10px; font-weight: 700;
  }
  .login-back { background: none; border: none; color: var(--text-secondary); font-size: 12px; cursor: pointer; margin-bottom: 14px; padding: 0; }
</style>
</head>
<body>
<div class="login-wrap">
  <button id="btn-theme-toggle" class="btn btn-ghost login-theme-btn" aria-label="Cambiar tema" title="Cambiar entre claro y oscuro">🌙</button>
  <div class="login-card">
    <h1><span>🍩</span> Krispy Gestiones</h1>

    <form id="login-form-usuario">
      <p>Inicia sesión para continuar.</p>
      <div class="login-field">
        <label for="login-username">Usuario</label>
        <input type="text" id="login-username" autocomplete="username" required>
      </div>
      <p class="login-error" id="login-error-usuario" hidden></p>
      <button type="submit" class="btn btn-primary">Continuar</button>
    </form>

    <form id="login-form-pin" hidden>
      <button type="button" class="login-back" id="btn-login-back">← Cambiar de usuario</button>
      <p id="login-pin-hint"></p>
      <div class="login-field">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="login-pin-input" id="login-pin" autocomplete="off" required>
      </div>
      <div class="login-field" id="login-pin-confirm-wrap" hidden>
        <label for="login-pin-confirm">Repite el PIN</label>
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="login-pin-input" id="login-pin-confirm" autocomplete="off">
      </div>
      <p class="login-error" id="login-error-pin" hidden></p>
      <button type="submit" class="btn btn-primary" id="btn-login-pin-submit">Entrar</button>
    </form>
  </div>
</div>
<script src="js/theme.js?v=20260722c"></script>
<script src="js/login.js?v=20260722c"></script>
</body>
</html>
