<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krispy Gestiones · Clima Laboral</title>
<link rel="icon" type="image/png" href="assets/favicon-kk.png">
<script>
  // Clima Laboral ya no tiene "landing" con dos tarjetas: al pulsar "Clima
  // Laboral" se entra directo al informe. La gestión del test/oleadas se
  // abre desde un enlace dentro del propio informe (solo para quien
  // gestiona encuestas). Este redirect conserva ?empresa=saona.
  (function () {
    var e = new URLSearchParams(location.search).get("empresa");
    location.replace("clima-informes.html" + (e === "saona" ? "?empresa=saona" : ""));
  })();
</script>
</head>
<body>
<p style="font-family:system-ui,sans-serif; color:#666; padding:24px;">Abriendo el informe de Clima Laboral…</p>
</body>
</html>
