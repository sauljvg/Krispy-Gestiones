<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krispy Gestiones · Clima Laboral</title>
<script>
  (function () {
    var guardado = localStorage.getItem("kt-theme");
    if (guardado === "light" || guardado === "dark") {
      document.documentElement.dataset.theme = guardado;
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="js/vendor/chart.umd.min.js"></script>
<style>
  .clima-wrap { max-width: 1100px; margin: 0 auto; padding: 0 0 40px; }
  .clima-report-title { text-align: center; margin: 10px 0 24px; }
  .clima-report-title img { height: 130px; width: auto; }
  .clima-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 16px 0; }
  .clima-toolbar select { padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-page); color: var(--text-primary); font-size: 13px; }
  .clima-import-check { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .centro-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .centro-card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; text-align: center; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .centro-card:hover { border-color: var(--series-blue); }
  .centro-card.active { border-color: var(--status-good); background: color-mix(in srgb, var(--status-good) 12%, var(--surface-1)); }

  .clima-header-stats { display: flex; gap: 20px; flex-wrap: wrap; margin: 12px 0 20px; color: var(--text-secondary); font-size: 13px; }
  .clima-header-stats b { color: var(--text-primary); }

  .score-boxes { display: flex; gap: 12px; margin-bottom: 24px; }
  .score-box { flex: 1; max-width: 220px; border-radius: 10px; padding: 16px; color: #fff; text-align: center; }
  .score-box .score-label { font-size: 12px; opacity: 0.9; }
  .score-box .score-value { font-size: 26px; font-weight: 700; margin-top: 4px; }
  .score-presente { background: #006838; }
  .score-anterior { background: #8a8a86; }

  .clima-chart-wrap { position: relative; margin-bottom: 10px; }

  .fo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 10px 0 24px; }
  .fo-col h3 { font-size: 13px; margin: 0 0 8px; }
  .fo-col p { font-size: 13px; margin: 0 0 6px; }
  .fo-fortaleza { color: var(--status-good); }
  .fo-oportunidad { color: var(--status-critical); }

  .nube-wrap { line-height: 2.2; margin-bottom: 12px; }
  .nube-palabra { color: #006838; font-weight: 600; margin-right: 10px; }
  .comentarios-lista { margin-bottom: 24px; }
  .comentarios-lista-titulo { font-size: 12px; color: var(--text-secondary); margin: 0 0 6px; }
  .comentarios-lista ul { margin: 0; padding-left: 18px; max-height: 220px; overflow-y: auto; }
  .comentarios-lista li { font-size: 13px; margin-bottom: 6px; color: var(--text-primary); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">🍩</span>
      <div>
        <h1>Krispy Gestiones</h1>
        <p class="subtitle">Clima Laboral</p>
      </div>
    </div>
    <div class="topbar-actions">
      <a href="/" class="btn btn-ghost" title="Volver al inicio">🏠 Inicio</a>
      <span id="topbar-user" class="topbar-user" hidden></span>
      <button id="btn-logout" class="btn btn-ghost" hidden>Salir</button>
      <button id="btn-theme-toggle" class="btn btn-ghost" aria-label="Cambiar tema" title="Cambiar entre claro y oscuro">🌙</button>
    </div>
  </header>

  <div class="clima-wrap">
    <div class="clima-toolbar">
      <label for="select-oleada">Oleada</label>
      <select id="select-oleada"></select>

      <label class="btn btn-primary btn-upload">
        ⬆ Importar Excel
        <input type="file" id="input-clima-upload" accept=".xlsx,.xls" hidden>
      </label>
      <label class="clima-import-check">
        <input type="checkbox" id="check-nueva-oleada">
        Nuevo Registro
      </label>

      <button id="btn-exportar-pdf" class="btn btn-ghost" hidden>⬇ Exportar PDF</button>
    </div>

    <div class="centro-grid" id="centro-grid"></div>

    <div id="reporte-wrap" hidden>
      <div class="clima-report-title">
        <img src="assets/la-voz-logo.png" alt="La Voz Krispy Kreme">
      </div>
      <div class="clima-header-stats" id="clima-header-stats"></div>

      <h2 style="font-size:15px;">Puntuación Global de Engagement</h2>
      <div class="score-boxes" id="score-boxes"></div>

      <h2 style="font-size:15px;">Resultados de Engagement</h2>
      <div class="clima-chart-wrap"><canvas id="chart-resultados"></canvas></div>

      <h2 style="font-size:15px;">Impulsores de Engagement</h2>
      <div class="clima-chart-wrap"><canvas id="chart-impulsores"></canvas></div>

      <h2 style="font-size:15px;">Fortalezas / Oportunidades</h2>
      <div class="fo-grid" id="fo-grid"></div>

      <h2 style="font-size:15px;">Comentarios abiertos</h2>
      <div id="comentarios-wrap"></div>
    </div>
  </div>
</div>
<script src="js/theme.js"></script>
<script src="js/auth-common.js"></script>
<script src="js/clima.js"></script>
</body>
</html>
