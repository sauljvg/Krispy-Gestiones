<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krispy Gestiones · Informes</title>
<link rel="icon" type="image/png" href="assets/favicon-kk.png">
<script>
  (function () {
    var guardado = localStorage.getItem("kt-theme");
    if (guardado === "light" || guardado === "dark") {
      document.documentElement.dataset.theme = guardado;
    }
  })();
</script>
<link rel="stylesheet" href="css/styles.css?v=20260728a">
<style>
  .informes-wrap { max-width: 1200px; margin: 0 auto; padding: 0 0 60px; }
  .informes-wrap .home-grid { margin: 20px 0 28px; }
  .informes-wrap .home-card { cursor: pointer; }
  .informes-header { display: flex; justify-content: space-between; align-items: center; }
  #tipo-detail-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .table-scroll { overflow-x: auto; }
  #tipo-detail-table { min-width: 600px; }
  .hoja-tabs { display: flex; gap: 6px; margin: 10px 0; }
  .hoja-tab { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-page); color: var(--text-secondary); cursor: pointer; font-size: 13px; }
  .hoja-tab.active { background: var(--acento); color: #fff; border-color: var(--acento); }
  .filtros-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin: 14px 0; }
  .filtros-row .campo { flex: 1 1 120px; min-width: 100px; }
  .filtros-row .campo.campo-ancho { flex: 1.6 1 170px; }
  .filtros-row .campo.campo-boton { flex: 0 0 auto; }
  .filtros-row .campo label { display: block; font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
  .filtros-row input, .filtros-row select {
    width: 100%; box-sizing: border-box; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-page); color: var(--text-primary); font-size: 13px;
  }
  .compartir-bar {
    display: none; align-items: center; gap: 10px; background: var(--surface-page);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px;
  }
  .compartir-bar.visible { display: flex; }
  .row-check { cursor: pointer; }
  .btn-cv { font-size: 12px; padding: 4px 8px; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none;
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.visible { display: flex; }
  .modal-box {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; width: 100%; max-width: 360px;
  }
  .modal-box h3 { margin: 0 0 14px; font-size: 16px; }
  .modal-box select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-page); color: var(--text-primary); margin-bottom: 14px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

  .columnas-wrap { position: relative; }
  .columnas-panel {
    display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 20;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; width: 240px; max-height: 320px; overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  }
  .columnas-panel.visible { display: block; }
  .columnas-panel-actions { display: flex; justify-content: space-between; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .columnas-panel-actions button { font-size: 11px; background: none; border: none; color: var(--acento); cursor: pointer; padding: 0; }
  .columna-check-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: 13px; }
  .columna-check-row label { flex: 1; cursor: pointer; }
  .btn-col-mover {
    width: 20px; height: 20px; line-height: 1; padding: 0; border-radius: 5px;
    border: 1px solid var(--border); background: var(--surface-page); color: var(--text-secondary);
    font-size: 11px; cursor: pointer; flex: none;
  }
  .btn-col-mover:hover:not(:disabled) { border-color: var(--acento); color: var(--acento); }
  .btn-col-mover:disabled { opacity: 0.3; cursor: not-allowed; }

  #tipo-detail-table td, #tipo-detail-table th {
    max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-align: center;
  }
  #tipo-detail-table td:first-child, #tipo-detail-table th:first-child {
    position: sticky; left: 0; z-index: 5;
    background: var(--surface-1);
    box-shadow: 2px 0 4px -2px rgba(0,0,0,0.15);
  }
  #tipo-detail-table tbody tr { cursor: pointer; }
  #tipo-detail-table tbody tr:hover td { background: var(--surface-page); }
  #tipo-detail-table tbody tr:hover td:first-child { background: var(--surface-page); }
  #tipo-detail-table tbody tr.fila-compartida td { background: color-mix(in srgb, var(--status-good) 12%, var(--surface-1)); }
  #tipo-detail-table tbody tr.fila-compartida:hover td { background: color-mix(in srgb, var(--status-good) 20%, var(--surface-1)); }
  #tipo-detail-table .col-compartido-con { color: var(--status-good); font-size: 12px; white-space: normal; }
  #tipo-detail-table th[draggable="true"] { cursor: grab; }
  #tipo-detail-table th.col-arrastrando { opacity: 0.4; }
  #tipo-detail-table th.col-drop-target { box-shadow: inset 2px 0 0 var(--acento); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" id="brand-icon">🍩</span>
      <div>
        <h1 id="brand-title">Krispy Gestiones</h1>
        <p class="subtitle">Informes</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button type="button" class="btn btn-ghost hamburger-btn" title="Atrás" aria-label="Atrás" onclick="history.back()">←</button>
      <a href="/" class="btn btn-ghost hamburger-btn" title="Inicio" aria-label="Inicio">🏠</a>
      <div class="hamburger-wrap">
        <button id="btn-hamburger" class="btn btn-ghost hamburger-btn" aria-label="Menú" aria-haspopup="true" aria-expanded="false">☰</button>
        <div id="hamburger-menu" class="hamburger-menu" hidden>
          <span id="topbar-user" class="topbar-user" hidden></span>
          <button id="btn-theme-toggle" class="btn btn-ghost" aria-label="Cambiar tema">🌙 Cambiar tema</button>
          <button id="btn-logout" class="btn btn-ghost" hidden>Salir</button>
        </div>
      </div>
    </div>
  </header>

  <div class="informes-wrap">
    <div class="hero-banner">
      <span class="eyebrow">Portal interno</span>
      <h1>Informes</h1>
      <p>Valores y competencias y más encuestas de Microsoft Forms.</p>
    </div>

    <div class="informes-header">
      <h2 style="font-size:18px; margin:0;">Selecciona un informe</h2>
      <button id="btn-new-tipo" class="btn btn-ghost">+ Nuevo tipo</button>
    </div>
    <div class="home-grid" id="tipos-grid"></div>

    <section class="chart-card" id="tipo-detail" hidden>
      <div id="tipo-detail-head">
        <h2 id="tipo-detail-title"></h2>
        <label class="btn btn-primary btn-upload">
          ⬆ Importar Excel
          <input type="file" id="input-informe-upload" accept=".xlsx,.xls" hidden>
        </label>
      </div>
      <p class="staff-hint" id="tipo-detail-hint"></p>

      <div style="display:flex; align-items:center; gap:10px;">
        <div class="hoja-tabs" id="hoja-tabs"></div>
        <div class="columnas-wrap">
          <button type="button" id="btn-hojas-gestionar" class="btn btn-ghost" title="Elegir qué hojas se muestran" hidden>⚙ Hojas</button>
          <div class="columnas-panel" id="hojas-panel">
            <div class="columnas-panel-actions">
              <span style="font-size:11px; color:var(--text-secondary);">Hojas visibles</span>
              <button type="button" id="btn-hojas-cerrar">Cerrar</button>
            </div>
            <div id="hojas-checklist"></div>
          </div>
        </div>
      </div>

      <div class="filtros-row">
        <div class="campo campo-ancho">
          <label for="f-buscar">Buscar</label>
          <input type="text" id="f-buscar" placeholder="Nombre, correo, texto…">
        </div>
        <div class="campo">
          <label for="f-orden">Ordenar por</label>
          <select id="f-orden"></select>
        </div>
        <div class="campo">
          <label for="f-orden-dir">Dirección</label>
          <select id="f-orden-dir">
            <option value="asc">Ascendente</option>
            <option value="desc">Descendente</option>
          </select>
        </div>
        <div class="campo" id="f-fecha-wrap" hidden>
          <label for="f-fecha-desde">Desde</label>
          <input type="date" id="f-fecha-desde">
        </div>
        <div class="campo" id="f-fecha-hasta-wrap" hidden>
          <label for="f-fecha-hasta">Hasta</label>
          <input type="date" id="f-fecha-hasta">
        </div>
        <div class="campo" id="f-no-aptos-wrap" hidden>
          <label for="f-filtro-aptos">Aptos</label>
          <select id="f-filtro-aptos">
            <option value="todos">Todos</option>
            <option value="excluir_no_aptos">Aptos</option>
            <option value="solo_no_aptos">No Aptos</option>
          </select>
        </div>
        <div class="campo campo-boton">
          <label>&nbsp;</label>
          <button type="button" id="btn-limpiar-filtros" class="btn btn-ghost">✕ Limpiar</button>
        </div>
        <div class="campo campo-boton columnas-wrap">
          <label>&nbsp;</label>
          <button type="button" id="btn-columnas" class="btn btn-ghost">⚏ Columnas</button>
          <div class="columnas-panel" id="columnas-panel">
            <div class="columnas-panel-actions">
              <button type="button" id="btn-columnas-todas">Mostrar todas</button>
              <button type="button" id="btn-columnas-cerrar">Cerrar</button>
            </div>
            <div id="columnas-checklist"></div>
          </div>
        </div>
      </div>

      <div class="compartir-bar" id="compartir-bar">
        <span id="compartir-count"></span>
        <button type="button" id="btn-compartir" class="btn btn-primary">Compartir seleccionados</button>
        <button type="button" id="btn-limpiar-seleccion" class="btn btn-ghost">Quitar selección</button>
      </div>

      <div class="table-scroll">
        <table class="staff-table" id="tipo-detail-table">
          <thead><tr id="tipo-detail-thead"></tr></thead>
          <tbody id="tipo-detail-tbody"></tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<div class="modal-overlay" id="compartir-modal">
  <div class="modal-box">
    <h3>Compartir con...</h3>
    <select id="compartir-usuario-select"></select>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="btn-compartir-cancelar">Cancelar</button>
      <button type="button" class="btn btn-primary" id="btn-compartir-confirmar">Compartir</button>
    </div>
  </div>
</div>

<script src="js/theme.js?v=20260723g"></script>
<script src="js/auth-common.js?v=20260723g"></script>
<script src="js/topbar-menu.js?v=20260727a"></script>
<script src="js/informes.js?v=20260727b"></script>
</body>
</html>
